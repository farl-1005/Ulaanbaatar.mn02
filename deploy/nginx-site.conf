# ulaanbaatar.mn апп (deploy/setup-nginx.sh үүсгэв). __DOMAIN__ → 127.0.0.1:__PORT__
# HTTPS-ийг certbot энэ файлд нэмнэ (certbot --nginx -d __DOMAIN__).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 8m;          # иргэдийн илгээх зураг (≤ 4.5 МБ)

    location /api/events {            # шууд мэдэгдэл (SSE): буферлэхгүй, урт холболт
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
